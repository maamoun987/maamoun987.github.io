<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشغل بث أبوظبي (ClearKey DRM)</title>
    <!-- استدعاء مكتبة Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        video {
            width: 80%;
            max-width: 800px;
            background: black;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        .info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>مشغل قناة أبوظبي (StarzPlay Stream)</h2>
    
    <video id="video" controls autoplay></video>
    
    <div class="info" id="status">جاري التهيئة والاتصال بالبث...</div>

    <script>
        // رابط البث ومفاتيح التشفير المستخرجة من ملفك
        const manifestUri = 'https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-2/51db9d7fa48a27d051f1eecb68069151/index.mpd';
        
        // مفتاح ClearKey (Key ID : Key)
        const clearKeyId = 'b1a8592dff8a4965983fd7f8ee7006dc';
        const clearKeyValue = '0954d76121a0c33c6e3f52175aca6c05';

        async function initApp() {
            // تثبيت بولي فิล للمكتبة
            shaka.polyfill.installAll();

            // التحقق من دعم المتصفح لـ Shaka Player
            if (!shaka.Player.isBrowserSupported()) {
                document.getElementById('status').innerText = 'المتصفح الخاص بك لا يدعم المشغل!';
                return;
            }

            const video = document.getElementById('video');
            const player = new shaka.Player(video);

            // تفعيل إعدادات مفاتيح ClearKey يدوياً
            player.configure({
                drm: {
                    clearKeys: {
                        [clearKeyId]: clearKeyValue
                    }
                }
            });

            // التعامل مع الأخطاء
            player.addEventListener('error', onErrorEvent);

            try {
                // تحميل البث
                await player.load(manifestUri);
                document.getElementById('status').innerText = 'تم بدء التشغيل بنجاح!';
                console.log('The video has now been loaded!');
            } catch (e) {
                onError(e);
            }
        }

        function onErrorEvent(event) {
            onError(event.detail);
        }

        function onError(error) {
    console.error('Shaka error:', error);

    const code = error?.code ?? 'unknown';
    const category = error?.category ?? 'unknown';
    const details = error?.data ?? [];
    const message = error?.message ?? 'No message';

    document.getElementById('status').innerText =
        'Error Code: ' + code +
        '\nCategory: ' + category +
        '\nMessage: ' + message +
        '\nData: ' + JSON.stringify(details);
}

        document.addEventListener('DOMContentLoaded', initApp);
    </script>

</body>
</html>
